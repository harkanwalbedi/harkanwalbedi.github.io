name: Sync Site with Medium RSS and Merged PRs

on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync Medium RSS and merged GitHub PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync.mjs
      - name: Rebuild static pages if data changed
        run: |
          if [ -n "$(git status --porcelain src/data/auto_synced.json)" ]; then
            npm run build
            cp -r dist/* .
            git config user.name "Harkanwal Bedi"
            git config user.email "bedi1887@gmail.com"
            git add src/data/auto_synced.json index.html projects/index.html _astro/
            git commit -m "chore: auto-sync site with latest posts and merged PRs"
            git push
          fi
